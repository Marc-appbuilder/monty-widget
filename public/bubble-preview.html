<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Bubble Preview</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 80px;
    min-height: 100vh;
    background: #1a1a1a;
  }

  .launcher {
    display: block;
    cursor: pointer;
    transition: transform 0.2s ease, filter 0.2s ease;
  }
  /* Idle: no glow on bubble */
  /* Hover: scale + green glow on bubble */
  .launcher:hover {
    transform: scale(1.07);
    filter: drop-shadow(0 0 10px rgba(183,255,42,0.45));
  }

  /* Bar animation */
  .bar {
    transform-box: fill-box;
    transform-origin: 50% 100%;
  }

  /* Each bar breathes at its own pace */
  .b1  { animation: wf 2.4s ease-in-out -0.2s  infinite; }
  .b2  { animation: wf 1.9s ease-in-out -1.1s  infinite; }
  .b3  { animation: wf 2.7s ease-in-out -0.6s  infinite; }
  .b4  { animation: wf 1.7s ease-in-out -1.8s  infinite; }
  .b5  { animation: wf 2.2s ease-in-out -0.4s  infinite; }
  .b6  { animation: wf 2.0s ease-in-out -2.2s  infinite; }
  .b7  { animation: wf 1.6s ease-in-out -0.9s  infinite; }
  .b8  { animation: wf 2.5s ease-in-out -1.5s  infinite; }
  .b9  { animation: wf 1.8s ease-in-out -0.1s  infinite; }
  .b10 { animation: wf 2.3s ease-in-out -1.3s  infinite; }
  .b11 { animation: wf 1.7s ease-in-out -0.7s  infinite; }
  .b12 { animation: wf 2.1s ease-in-out -2.0s  infinite; }
  .b13 { animation: wf 1.9s ease-in-out -0.5s  infinite; }

  @keyframes wf {
    0%,100% { transform: scaleY(0.25); opacity: 0.55; }
    50%     { transform: scaleY(1);    opacity: 1;    }
  }

  /* Hover: faster bars, brighter */
  .launcher:hover .b1  { animation-duration: 0.60s; }
  .launcher:hover .b2  { animation-duration: 0.48s; }
  .launcher:hover .b3  { animation-duration: 0.68s; }
  .launcher:hover .b4  { animation-duration: 0.43s; }
  .launcher:hover .b5  { animation-duration: 0.55s; }
  .launcher:hover .b6  { animation-duration: 0.50s; }
  .launcher:hover .b7  { animation-duration: 0.40s; }
  .launcher:hover .b8  { animation-duration: 0.63s; }
  .launcher:hover .b9  { animation-duration: 0.45s; }
  .launcher:hover .b10 { animation-duration: 0.58s; }
  .launcher:hover .b11 { animation-duration: 0.43s; }
  .launcher:hover .b12 { animation-duration: 0.53s; }
  .launcher:hover .b13 { animation-duration: 0.48s; }
  .launcher:hover .bars { filter: brightness(1.25); }
</style>
</head>
<body>

<!--
  Speech bubble shape: copy of aha.png
  - Thick dark-blue stroke outline (~3.5px), dark interior
  - Tail at bottom-left, smooth bezier
  - Inside: 13 waveform bars with V dip in the middle (bar 7 = shortest)
  - Bar heights: 18 22 20 24 20 22 8 22 20 24 20 22 18
                 |  |  |  |  |  | V |  |  |  |  |  |
-->

<!-- On dark background (like aha.png) -->
<svg class="launcher" width="92" height="82" viewBox="0 0 92 82"
     role="button" aria-label="Open chat">
  <defs>
    <!-- Soft glow on the bars themselves, matching the reference image -->
    <filter id="bar-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!--
    Single path: wide rounded bubble + smooth tail at bottom-left.
    Stroke = thick dark blue. Fill = near-black.
  -->
  <path
    d="
      M 22 3
      L 70 3
      Q 89 3 89 22
      L 89 48
      Q 89 63 70 63
      L 30 63
      Q 18 63 12 72
      Q  8 78  4 80
      Q  8 74 12 66
      Q  4 62  4 50
      L  4 22
      Q  4  3 22  3
      Z
    "
    fill="#0a0a12"
    stroke="#2B4899"
    stroke-width="3.5"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!--
    13 bars. Heights: 18 22 20 24 20 22 | 8 | 22 20 24 20 22 18
    Anchored at y=50. Bar width 3px, gap 3px.
    x positions (left edge): 14 20 26 32 38 44 | 50 | 56 62 68 74 (stop, too wide)

    Let me use 2.5px bars, 2.5px gaps:
    Total = 13×2.5 + 12×2.5 = 32.5+30 = 62.5px (too wide for 85px bubble with margin)
    Use 2.5px bars, 2px gaps: 13×2.5 + 12×2 = 32.5+24 = 56.5px
    Center at x=46.5, left edge = 46.5-28.25 = 18.25 → 18
    Bar x: 18, 22.5, 27, 31.5, 36, 40.5, 45, 49.5, 54, 58.5, 63, 67.5, 72
  -->
  <g class="bars" filter="url(#bar-glow)">
    <!-- Heights: 18 22 20 24 20 22  8 22 20 24 20 22 18  anchored at y=50 -->
    <rect class="bar b1"  x="18"   y="32" width="2.5" height="18" rx="1.25" fill="#B7FF2A"/>
    <rect class="bar b2"  x="22.5" y="28" width="2.5" height="22" rx="1.25" fill="#B7FF2A"/>
    <rect class="bar b3"  x="27"   y="30" width="2.5" height="20" rx="1.25" fill="#B7FF2A"/>
    <rect class="bar b4"  x="31.5" y="26" width="2.5" height="24" rx="1.25" fill="#B7FF2A"/>
    <rect class="bar b5"  x="36"   y="30" width="2.5" height="20" rx="1.25" fill="#B7FF2A"/>
    <rect class="bar b6"  x="40.5" y="28" width="2.5" height="22" rx="1.25" fill="#B7FF2A"/>
    <!-- V valley — shortest bar in the centre -->
    <rect class="bar b7"  x="45"   y="42" width="2.5" height="8"  rx="1.25" fill="#B7FF2A"/>
    <rect class="bar b8"  x="49.5" y="28" width="2.5" height="22" rx="1.25" fill="#B7FF2A"/>
    <rect class="bar b9"  x="54"   y="30" width="2.5" height="20" rx="1.25" fill="#B7FF2A"/>
    <rect class="bar b10" x="58.5" y="26" width="2.5" height="24" rx="1.25" fill="#B7FF2A"/>
    <rect class="bar b11" x="63"   y="30" width="2.5" height="20" rx="1.25" fill="#B7FF2A"/>
    <rect class="bar b12" x="67.5" y="28" width="2.5" height="22" rx="1.25" fill="#B7FF2A"/>
    <rect class="bar b13" x="72"   y="32" width="2.5" height="18" rx="1.25" fill="#B7FF2A"/>
  </g>
</svg>

<!-- On white background -->
<svg class="launcher" width="92" height="82" viewBox="0 0 92 82"
     role="button" aria-label="Open chat"
     style="background:#fff; border-radius:16px; padding:0;">
  <defs>
    <filter id="bar-glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <path
    d="M 22 3 L 70 3 Q 89 3 89 22 L 89 48 Q 89 63 70 63 L 30 63 Q 18 63 12 72 Q 8 78 4 80 Q 8 74 12 66 Q 4 62 4 50 L 4 22 Q 4 3 22 3 Z"
    fill="#0a0a12"
    stroke="#2B4899"
    stroke-width="3.5"
    stroke-linejoin="round"
    stroke-linecap="round"
  />
  <g class="bars" filter="url(#bar-glow2)">
    <rect class="bar b1"  x="18"   y="32" width="2.5" height="18" rx="1.25" fill="#B7FF2A"/>
    <rect class="bar b2"  x="22.5" y="28" width="2.5" height="22" rx="1.25" fill="#B7FF2A"/>
    <rect class="bar b3"  x="27"   y="30" width="2.5" height="20" rx="1.25" fill="#B7FF2A"/>
    <rect class="bar b4"  x="31.5" y="26" width="2.5" height="24" rx="1.25" fill="#B7FF2A"/>
    <rect class="bar b5"  x="36"   y="30" width="2.5" height="20" rx="1.25" fill="#B7FF2A"/>
    <rect class="bar b6"  x="40.5" y="28" width="2.5" height="22" rx="1.25" fill="#B7FF2A"/>
    <rect class="bar b7"  x="45"   y="42" width="2.5" height="8"  rx="1.25" fill="#B7FF2A"/>
    <rect class="bar b8"  x="49.5" y="28" width="2.5" height="22" rx="1.25" fill="#B7FF2A"/>
    <rect class="bar b9"  x="54"   y="30" width="2.5" height="20" rx="1.25" fill="#B7FF2A"/>
    <rect class="bar b10" x="58.5" y="26" width="2.5" height="24" rx="1.25" fill="#B7FF2A"/>
    <rect class="bar b11" x="63"   y="30" width="2.5" height="20" rx="1.25" fill="#B7FF2A"/>
    <rect class="bar b12" x="67.5" y="28" width="2.5" height="22" rx="1.25" fill="#B7FF2A"/>
    <rect class="bar b13" x="72"   y="32" width="2.5" height="18" rx="1.25" fill="#B7FF2A"/>
  </g>
</svg>

</body>
</html>
