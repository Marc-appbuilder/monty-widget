<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vaughan Widget — Compare</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 28px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      flex-shrink: 0;
    }

    header h1 {
      font-size: 14px;
      font-weight: 600;
      color: rgba(255,255,255,0.9);
      letter-spacing: 0.02em;
    }

    header span {
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      font-weight: 400;
    }

    .panels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      flex: 1;
      overflow: hidden;
    }

    .panel {
      position: relative;
      overflow: hidden;
      border-right: 1px solid rgba(255,255,255,0.06);
    }

    .panel:last-child { border-right: none; }

    .panel iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .label {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.55);
      padding: 5px 14px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>

  <header>
    <h1>Vaughan V — Widget Comparison</h1>
    <span>widget-redesign branch</span>
  </header>

  <div class="panels">
    <div class="panel">
      <div class="label">Rounded ends</div>
      <iframe id="f1"></iframe>
    </div>
    <div class="panel">
      <div class="label">Flat ends</div>
      <iframe id="f2"></iframe>
    </div>
  </div>

  <script>
    var base = 'https://cdn.jsdelivr.net/gh/Marc-appbuilder/monty-widget@widget-redesign/public/embed.js';
    var api  = 'https://app.vaughanai.co';
    var bg   = '#1c1c1c';

    function makeSrcdoc(extraParams) {
      return '<!DOCTYPE html><html><head>' +
        '<meta name="viewport" content="width=device-width,initial-scale=1">' +
        '<style>*{margin:0;padding:0}body{min-height:100vh;background:' + bg + '}</style>' +
        '</head><body>' +
        '<script src="' + base + '?clientId=vaughan-and-co&origin=' + api + extraParams + '" async><\/script>' +
        '</body></html>';
    }

    document.getElementById('f1').srcdoc = makeSrcdoc('');
    document.getElementById('f2').srcdoc = makeSrcdoc('&linecap=butt');
  </script>

</body>
</html>
